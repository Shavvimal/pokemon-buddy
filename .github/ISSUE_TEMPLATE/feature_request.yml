name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What would you like the buddy to do, and why?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - a new sprite source
        - drawing or animation
        - settings
        - caching or network
        - other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        A new source must be publicly published, and gets credited in README.md and
        NOTICE.md. Never attach sprite files to an issue.
